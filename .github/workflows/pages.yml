name: pages

# Menerbitkan LogikaKu ke GitHub Pages setiap ada push ke main.
# Deploy hanya berjalan kalau repo sudah publik dan Pages sudah dinyalakan
# dengan Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bangun:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Hanya file yang dibutuhkan browser yang ikut terbit.
      - run: mkdir -p _site && cp -r index.html css js data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
