name: pages

# Menerbitkan versi demo LogikaKu (tanpa Laravel) ke GitHub Pages setiap ada push ke main.
# Deploy hanya berjalan kalau repo sudah publik dan Pages sudah dinyalakan
# dengan Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bangun:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub Pages tidak bisa menjalankan Laravel, jadi yang terbit adalah mode demo:
      # tampilan yang sama tanpa baris "mode-server", progres contoh di localStorage.
      - run: |
          mkdir -p _site
          cp -r public/css public/js public/data _site/
          cp public/favicon.svg public/apple-touch-icon.png public/ikon-192.png public/ikon-512.png public/og-image.png public/site.webmanifest _site/
          # Alamat pratinjau tautan (og:url, og:image) memakai alamat GitHub Pages.
          ALAMAT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          grep -v 'mode-server' resources/views/app.blade.php | sed "s#{{ url('/') }}#${ALAMAT}#g" > _site/index.html
          sed "s#{{ url('/') }}#${ALAMAT}#g" resources/views/errors/404.blade.php > _site/404.html
          if grep -n '{{\|@csrf\|@if' _site/index.html _site/404.html; then echo "Masih ada sintaks Blade di versi demo"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
